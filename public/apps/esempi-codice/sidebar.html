<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snippet — Sidebar Dinamica</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="h-screen bg-gray-50">
  <div class="h-full flex">
    <aside class="w-64 bg-slate-900 text-white p-6 space-y-2">
      <h3 class="font-bold text-lg mb-3">Sezioni</h3>
      <button class="link block w-full text-left px-3 py-2 rounded hover:bg-white/10" data-k="intro">Introduzione</button>
      <button class="link block w-full text-left px-3 py-2 rounded hover:bg-white/10" data-k="docs">Documentazione</button>
      <button class="link block w-full text-left px-3 py-2 rounded hover:bg-white/10" data-k="faq">FAQ</button>
    </aside>
    <main id="pane" class="flex-1 p-8 overflow-auto">
      <h2 class="text-2xl font-bold">Benvenuto</h2>
      <p>Seleziona una sezione dalla sidebar.</p>
    </main>
  </div>
<script>
  const pages = {
    intro: "<h2 class='text-2xl font-bold'>Introduzione</h2><p class='mt-2'>Questo contenuto viene cambiato a destra senza reload.</p>",
    docs: "<h2 class='text-2xl font-bold'>Documentazione</h2><ul class='list-disc pl-5'><li>Installazione</li><li>API</li></ul>",
    faq: "<h2 class='text-2xl font-bold'>FAQ</h2><p>Domande frequenti con risposte sintetiche.</p>"
  };
  const pane = document.getElementById('pane');
  document.querySelectorAll('.link').forEach(b=>b.addEventListener('click', ()=>{ pane.innerHTML = pages[b.dataset.k] }));
</script>
</body></html>
