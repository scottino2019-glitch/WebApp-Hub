<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snippet — Tabs</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-8">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow p-6">
    <div class="flex gap-2 mb-4">
      <button class="t px-3 py-2 rounded bg-slate-900 text-white" data-k="a">Tab A</button>
      <button class="t px-3 py-2 rounded" data-k="b">Tab B</button>
      <button class="t px-3 py-2 rounded" data-k="c">Tab C</button>
    </div>
    <div id="tabContent">Contenuto A</div>
  </div>
<script>
  const content={a:"Contenuto A", b:"Contenuto B", c:"Contenuto C"};
  const view=document.getElementById('tabContent');
  document.querySelectorAll('.t').forEach(b=>b.addEventListener('click',()=>{ 
    view.textContent=content[b.dataset.k]; 
    document.querySelectorAll('.t').forEach(x=>x.classList.remove('bg-slate-900','text-white'));
    b.classList.add('bg-slate-900','text-white');
  }));
</script>
</body></html>
