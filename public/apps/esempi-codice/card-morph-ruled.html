<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Morph - TEMA LIBERO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700;900&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --bg-color: #FFFFFF;
            --text-color: #1E40AF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0f1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-sans);
        }

        /* Core Card Container */
        .card-wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 3/4.5;
            perspective: 1200px;
        }

        /* Core Card Physical Container */
        .card-inner-container {
            position: relative;
            width: 100%;
            height: 100%;
            color: var(--text-color);
            transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 60px 100px -30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* The actual shaped background */
        .shape-bg {
            position: absolute;
            inset: 0;
            background-color: var(--bg-color);
            z-index: 0;
            clip-path: polygon(0% 0%, 100% 0%, 99% 10%, 100% 20%, 99% 30%, 100% 40%, 99% 50%, 100% 60%, 99% 70%, 100% 80%, 99% 90%, 100% 100%, 0% 100%); border-left: 15px double #f87171; background-color: #ffffff; background-image: repeating-linear-gradient(transparent, transparent 2.45rem, #bfdbfe 2.5rem); background-attachment: local;
        }

        .card-inner-container:hover {
            transform: scale(1.03) translateY(-15px) rotateY(2deg);
        }

        .content-area {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Reflections layer */
        .gloss {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(0,0,0,0.2) 100%);
            z-index: 5;
            clip-path: polygon(0% 0%, 100% 0%, 99% 10%, 100% 20%, 99% 30%, 100% 40%, 99% 50%, 100% 60%, 99% 70%, 100% 80%, 99% 90%, 100% 100%, 0% 100%); border-left: 15px double #f87171; background-color: #ffffff; background-image: repeating-linear-gradient(transparent, transparent 2.45rem, #bfdbfe 2.5rem); background-attachment: local;
        }

        /* Overlays / Decorations */
        .decor { position: absolute; pointer-events: none; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
        @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
        
        .blink { animation: blink 4s infinite; }
        .pulse { animation: pulse 2s infinite; }

        /* User Custom CSS */
        
.card-body { padding: 12% 10% 10% 20%; height: 100%; display: flex; flex-direction: column; overflow: visible; }
.card-title { font-family: var(--font-display); font-size: 2.25rem; font-weight: 950; line-height: 0.8; letter-spacing: -2px; text-transform: uppercase; margin-bottom: 0.75rem; }
.card-divider { height: 4px; width: 120px; background: currentColor; opacity: 0.2; border-radius: 99px; transition: width 1s ease-out; }
.content-area { flex: 1; padding-top: 2rem; position: relative; overflow: visible; }
.ruled-doc { font-family: var(--font-serif); flex: 1; }
.grading { position: absolute; top: 0; right: 20px; font-family: var(--font-marker); font-size: 6rem; color: #EF4444; opacity: 0; animation: grad-stomp 1s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes grad-stomp { from { transform: scale(5) rotate(30deg); opacity: 0; } to { transform: scale(1) rotate(10deg); opacity: 0.8; } }
.header { font-family: var(--font-display); font-size: 2rem; text-decoration: underline wavy #3b82f6; margin-bottom: 2rem; }
.hand-write { font-family: var(--font-hand); font-size: 1.5rem; line-height: 2rem; opacity: 0; animation: fade-up 1s forwards; }
.ani-1 { animation-delay: 1s; }
.ani-2 { animation-delay: 2s; }
@keyframes fade-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="card-wrapper">
        <div class="card-inner-container">
            <div class="shape-bg"></div>
            <div class="gloss"></div>
            
            <div class="content-area">
                
<div class="card-body">
  <div class="card-header">
    <h2 class="card-title">TEMA LIBERO</h2>
    <div class="card-divider"></div>
  </div>
  <div class="content-area">
    <div class="ruled-doc">
      <div class="grading">A++</div>
      <h1 class="header">Il Sogno di Peggy</h1>
      <p class="hand-write ani-1">In un mondo dominato dai bit, Peggy cercava la bellezza degli atomi.</p>
      <p class="hand-write ani-2">Ogni sua creazione era un ponte tra il digitale e il reale.</p>
    </div>
  </div>
</div>
            </div>

            <!-- Decorations Generated Here -->
            
        </div>
    </div>
</body>
</html>
