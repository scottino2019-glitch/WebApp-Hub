<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 JavaScript Playground Interattivo 🚀</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar per un'estetica migliore */
        textarea::-webkit-scrollbar, #output::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        textarea::-webkit-scrollbar-track, #output::-webkit-scrollbar-track {
            background: #2d3748;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb, #output::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover, #output::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }
        /* Font per l'editor e l'output */
        .code-editor {
            font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        /* Stili per la console reindirizzata */
        #output span.log { color: #cbd5e0; }
        #output span.error { color: #fc8181; }
        #output span.warn { color: #faf089; }
        #output span.info { color: #90cdf4; }
        
        /* Ottimizzazione altezze */
        #editor {
            min-height: 400px;
        }
        #output {
            min-height: 180px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-gray-800 p-6 shadow-md border-b border-gray-700">
        <h1 class="text-3xl font-bold text-center text-blue-400">🚀 JavaScript Playground Interattivo 🚀</h1>
        <p class="text-center text-gray-400 mt-2">Impara, sperimenta e crea con JavaScript direttamente nel browser.</p>
    </header>

    <main class="flex-grow container mx-auto p-4 lg:p-8 flex flex-col lg:flex-row gap-6">

        <!-- Sidebar: Esempi (25% di larghezza) -->
        <aside class="w-full lg:w-1/4 bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700 h-fit">
            <h2 class="text-xl font-semibold text-blue-300 mb-4 flex items-center">
                <span class="mr-2">📚</span> Esempi di Codice
            </h2>
            <div class="space-y-2 max-h-[60vh] overflow-y-auto pr-2">
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('intro')">👋 Intro & Console</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('variables')">🔢 Variabili e Tipi</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('conditionals')">🤔 Condizionali</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('loops')">🔄 Cicli (Loops)</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('functions')">⚙️ Funzioni</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('arrays')">📋 Array</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('objects')">🧩 Oggetti</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('dom')">🌐 Manipolazione DOM</button>
                <button class="w-full text-left bg-gray-700 hover:bg-blue-600 text-sm py-2 px-3 rounded-lg transition duration-200" onclick="loadExample('async')">⏳ Asincronia (Fetch)</button>
            </div>
        </aside>

        <!-- Area Editor e Console (75% di larghezza) -->
        <div class="w-full lg:w-3/4 flex flex-col gap-6">
            
            <!-- Box Editor -->
            <section class="flex flex-col bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-blue-300">Editor</h2>
                    <div class="flex space-x-2">
                         <button id="clearEditorButton" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1 px-3 rounded transition duration-200">Pulisci</button>
                         <button id="resetEditorButton" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-300 py-1 px-3 rounded transition duration-200">Ripristina</button>
                    </div>
                </div>
                
                <textarea
                    id="editor"
                    class="code-editor w-full p-4 bg-gray-900 text-green-400 border border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y overflow-auto shadow-inner"
                    spellcheck="false"
                ></textarea>
                
                <div class="mt-4">
                    <button id="runButton" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-xl shadow-lg transform active:scale-95 transition-all text-xl">
                        ▶️ Esegui il Codice
                    </button>
                </div>
            </section>

            <!-- Box Console -->
            <section class="flex flex-col bg-gray-800 p-6 rounded-xl shadow-xl border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-semibold text-blue-300">Console</h2>
                    <button id="clearOutputButton" class="text-xs bg-indigo-900 hover:bg-indigo-800 text-indigo-200 py-1 px-3 rounded transition duration-200">Pulisci Output</button>
                </div>
                <div
                    id="output"
                    class="code-editor w-full p-4 bg-black text-gray-200 border border-gray-700 rounded-lg overflow-auto whitespace-pre-wrap break-words shadow-inner"
                ></div>
            </section>

        </div>

    </main>

    <footer class="bg-gray-800 p-4 text-center text-gray-500 mt-8 border-t border-gray-700">
        🚀 Progetto Playground JS - Layout Ottimizzato
    </footer>

    <script>
        // --- Inizializzazione Elementi ---
        const editor = document.getElementById('editor');
        const output = document.getElementById('output');
        const runButton = document.getElementById('runButton');
        const clearEditorButton = document.getElementById('clearEditorButton');
        const resetEditorButton = document.getElementById('resetEditorButton');
        const clearOutputButton = document.getElementById('clearOutputButton');

        // Salvataggio dei riferimenti originali della console
        const originalConsoleLog = console.log;
        const originalConsoleWarn = console.warn;
        const originalConsoleError = console.error;
        const originalConsoleInfo = console.info;

        let initialEditorContent = "";

        // --- Funzioni Core ---

        function redirectConsole() {
            console.log = (...args) => {
                const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
                output.innerHTML += `<span class="log">${message}</span>\n`;
                output.scrollTop = output.scrollHeight;
                originalConsoleLog(...args);
            };
            console.warn = (...args) => {
                const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
                output.innerHTML += `<span class="warn">⚠️ ${message}</span>\n`;
                output.scrollTop = output.scrollHeight;
                originalConsoleWarn(...args);
            };
            console.error = (...args) => {
                const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
                output.innerHTML += `<span class="error">❌ ${message}</span>\n`;
                output.scrollTop = output.scrollHeight;
                originalConsoleError(...args);
            };
            console.info = (...args) => {
                const message = args.map(arg => typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)).join(' ');
                output.innerHTML += `<span class="info">ℹ️ ${message}</span>\n`;
                output.scrollTop = output.scrollHeight;
                originalConsoleInfo(...args);
            };
        }

        function runCode() {
            clearOutput();
            try {
                const userCode = editor.value;
                const execute = new Function(userCode);
                execute();
            } catch (error) {
                console.error("Errore di runtime: " + error.message);
            }
        }

        function clearEditor() { editor.value = ''; }
        function resetEditor() { editor.value = initialEditorContent; clearOutput(); }
        function clearOutput() { output.innerHTML = ''; }

        // --- Database Esempi (Ripristinati integralmente) ---
        const examples = {
            intro: `// Benvenuto nel JavaScript Playground!
console.log("Ciao dal tuo codice JS!");
console.warn("Questo è un avviso della console.");
console.info("Informazione utile: puoi modificare questo codice e ri-eseguirlo.");
`,
            variables: `// --- 1. Variabili e Tipi di Dati ---
let nome = "Leonardo";    // Stringa
const eta = 25;           // Numero (costante)
let isProgrammatore = true; // Booleano

console.log("Nome:", nome);
console.log("Età:", eta);
console.log("È programmatore?", isProgrammatore);

// Template Literal (stringhe dinamiche)
console.log(\`Ciao, mi chiamo \${nome} e ho \${eta} anni.\`);
`,
            conditionals: `// --- 2. Condizionali (if/else) ---
let punteggio = 85;

if (punteggio >= 90) {
    console.log("Ottimo! Hai preso A.");
} else if (punteggio >= 70) {
    console.log("Buon lavoro! Hai preso B.");
} else {
    console.log("Puoi fare di meglio!");
}

// Operatore ternario
let messaggio = (punteggio >= 60) ? "Promosso ✅" : "Bocciato ❌";
console.log("Risultato:", messaggio);
`,
            loops: `// --- 3. Cicli (Loops) ---
console.log("Conto fino a 5 con il ciclo for:");
for (let i = 1; i <= 5; i++) {
    console.log("Numero:", i);
}

console.log("\\nIterazione di un array con for...of:");
const frutti = ["Mela", "Banana", "Arancia"];
for (const frutto of frutti) {
    console.log("- " + frutto);
}
`,
            functions: `// --- 4. Funzioni ---
// Funzione classica
function calcolaAreaRettangolo(base, altezza) {
    return base * altezza;
}

// Arrow function (sintassi moderna)
const saluta = (nome) => \`Ciao, \${nome}!\`;

console.log("Area (10x5):", calcolaAreaRettangolo(10, 5));
console.log(saluta("Sviluppatore"));
`,
            arrays: `// --- 5. Metodi degli Array ---
const numeri = [1, 2, 3, 4, 5];

// Aggiungere e rimuovere
numeri.push(6);
console.log("Dopo push:", numeri);

// Map: crea un nuovo array trasformando gli elementi
const quadrati = numeri.map(n => n * n);
console.log("Quadrati:", quadrati);

// Filter: filtra gli elementi
const pari = numeri.filter(n => n % 2 === 0);
console.log("Solo pari:", pari);
`,
            objects: `// --- 6. Oggetti ---
const persona = {
    nome: "Mario",
    cognome: "Rossi",
    professione: "Designer",
    saluta: function() {
        console.log(\`Buongiorno, sono \${this.nome} \${this.cognome}.\`);
    }
};

console.log("Professione:", persona.professione);
persona.saluta();
`,
            dom: `// --- 7. Manipolazione DOM (Solo per visualizzazione) ---
console.log("Proviamo a cambiare lo stile del titolo h1!");

const h1 = document.querySelector('h1');
h1.style.color = '#f87171'; // Cambia in rosso chiaro
h1.style.textShadow = '2px 2px 4px rgba(0,0,0,0.5)';

console.log("Titolo modificato con successo.");
`,
            async: `// --- 8. Asincronia (Async/Await) ---
async function fetchPost() {
    console.log("Recupero dati da un'API esterna...");
    try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts/1');
        const post = await response.json();
        
        console.log("Dati ricevuti con successo:");
        console.log("Titolo del post:", post.title);
        console.log("Corpo del post:", post.body);
    } catch (error) {
        console.error("Errore nel recupero dati:", error);
    }
}

fetchPost();
`
        };

        function loadExample(exampleName) {
            if (examples[exampleName]) {
                editor.value = examples[exampleName];
                clearOutput();
                initialEditorContent = editor.value;
                output.innerHTML = `<span class="info">Esempio '${exampleName}' caricato.</span>\n`;
            }
        }

        // Event Listeners
        runButton.addEventListener('click', runCode);
        clearEditorButton.addEventListener('click', clearEditor);
        resetEditorButton.addEventListener('click', resetEditor);
        clearOutputButton.addEventListener('click', clearOutput);

        // Init
        redirectConsole();
        loadExample('intro');
    </script>
</body>
</html>
