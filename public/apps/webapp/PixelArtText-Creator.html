<!doctype html>
<html lang="it" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Pixel Art Text</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    
    .font-pixel {
      font-family: 'Press Start 2P', cursive;
    }
    
    .font-retro {
      font-family: 'VT323', monospace;
    }
    
    .pixel-text {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      line-height: 1.8;
      letter-spacing: 0.1em;
    }
    
    .pixel-shadow {
      text-shadow: 
        2px 2px 0 rgba(0,0,0,0.3),
        4px 4px 0 rgba(0,0,0,0.2);
    }
    
    .glass-card {
      background: rgba(20, 20, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .style-btn {
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    
    .style-btn:hover {
      transform: translateY(-2px);
    }
    
    .style-btn.active::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px solid #10b981;
      border-radius: 0.75rem;
      pointer-events: none;
    }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    .blink-cursor::after {
      content: '▮';
      animation: blink 1s infinite;
      margin-left: 4px;
    }
    
    @keyframes pixelPop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .pixel-pop {
      animation: pixelPop 0.3s ease-out;
    }
    
    .grid-bg {
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full font-pixel">
  <div id="app-wrapper" class="h-full w-full overflow-auto" style="background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);">
   <div class="min-h-full w-full p-6 md:p-8"><!-- Header -->
    <header class="text-center mb-8">
     <h1 class="text-3xl md:text-4xl mb-3 pixel-pop" style="color: #10b981; text-shadow: 3px 3px 0 rgba(16, 185, 129, 0.3);">👾 PIXEL ART TEXT</h1>
     <p class="text-sm md:text-base font-retro" style="color: #a7f3d0;">Trasforma il tuo testo in stile retro 8-bit</p>
    </header><!-- Main Content -->
    <div class="max-w-5xl mx-auto space-y-6"><!-- Input Section -->
     <div class="glass-card rounded-2xl p-6 shadow-xl"><label class="block text-sm font-retro mb-3" style="color: #d1d5db;">IL TUO TESTO</label> <input type="text" id="text-input" placeholder="Scrivi qui..." maxlength="20" class="w-full px-5 py-4 rounded-xl text-lg font-pixel focus:outline-none focus:ring-2 transition-all" style="background: rgba(0,0,0,0.4); color: #10b981; border: 2px solid rgba(16, 185, 129, 0.3); font-size: 14px;">
      <div class="mt-2 text-xs font-retro text-right" style="color: #6b7280;"><span id="char-count">0</span> / 20 caratteri
      </div>
     </div><!-- Style Selection -->
     <div class="glass-card rounded-2xl p-6 shadow-xl"><label class="block text-sm font-retro mb-4" style="color: #d1d5db;">STILE RETRO</label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="style-selector"><button class="style-btn active px-4 py-6 rounded-xl text-center" data-style="gameboy" style="background: linear-gradient(135deg, #9bbc0f 0%, #8bac0f 100%);">
        <div class="text-2xl mb-2">
         🎮
        </div>
        <div class="text-xs font-retro" style="color: #0f380f;">
         GAME BOY
        </div></button> <button class="style-btn px-4 py-6 rounded-xl text-center" data-style="nes" style="background: linear-gradient(135deg, #e60012 0%, #c40010 100%);">
        <div class="text-2xl mb-2">
         🕹️
        </div>
        <div class="text-xs font-retro" style="color: white;">
         NES
        </div></button> <button class="style-btn px-4 py-6 rounded-xl text-center" data-style="arcade" style="background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);">
        <div class="text-2xl mb-2">
         👾
        </div>
        <div class="text-xs font-retro" style="color: #1a1a1a;">
         ARCADE
        </div></button> <button class="style-btn px-4 py-6 rounded-xl text-center" data-style="cyber" style="background: linear-gradient(135deg, #00ffff 0%, #00d4ff 100%);">
        <div class="text-2xl mb-2">
         🤖
        </div>
        <div class="text-xs font-retro" style="color: #1a1a1a;">
         CYBER
        </div></button>
      </div>
     </div><!-- Controls -->
     <div class="grid md:grid-cols-2 gap-6"><!-- Colors -->
      <div class="glass-card rounded-2xl p-6 shadow-xl"><label class="block text-sm font-retro mb-4" style="color: #d1d5db;">COLORI</label>
       <div class="space-y-4">
        <div><label class="block text-xs font-retro mb-2" style="color: #9ca3af;">COLORE PIXEL</label> <input type="color" id="pixel-color" value="#10b981" class="w-full h-12 rounded-lg cursor-pointer" style="border: 2px solid rgba(255,255,255,0.1);">
        </div>
        <div><label class="block text-xs font-retro mb-2" style="color: #9ca3af;">COLORE SFONDO</label> <input type="color" id="bg-color" value="#0f0c29" class="w-full h-12 rounded-lg cursor-pointer" style="border: 2px solid rgba(255,255,255,0.1);">
        </div>
       </div>
      </div><!-- Settings -->
      <div class="glass-card rounded-2xl p-6 shadow-xl"><label class="block text-sm font-retro mb-4" style="color: #d1d5db;">IMPOSTAZIONI</label>
       <div class="space-y-4">
        <div><label class="block text-xs font-retro mb-2" style="color: #9ca3af;">DIMENSIONE</label> <select id="size-select" class="w-full px-4 py-3 rounded-lg font-retro cursor-pointer focus:outline-none focus:ring-2" style="background: rgba(0,0,0,0.4); color: #10b981; border: 2px solid rgba(16, 185, 129, 0.3);"> <option value="small">PICCOLO</option> <option value="medium" selected>MEDIO</option> <option value="large">GRANDE</option> </select>
        </div>
        <div class="flex items-center gap-3"><input type="checkbox" id="shadow-toggle" checked class="w-5 h-5 rounded cursor-pointer" style="accent-color: #10b981;"> <label for="shadow-toggle" class="text-xs font-retro cursor-pointer" style="color: #d1d5db;"> OMBRA PIXEL </label>
        </div>
       </div>
      </div>
     </div><!-- Preview Section -->
     <div class="glass-card rounded-2xl p-8 shadow-xl">
      <div class="flex items-center justify-between mb-6"><label class="text-sm font-retro" style="color: #d1d5db;">ANTEPRIMA</label> <button id="clear-btn" class="px-4 py-2 rounded-lg text-xs font-retro transition-all hover:opacity-80" style="background: rgba(239, 68, 68, 0.3); color: #fca5a5;"> [X] PULISCI </button>
      </div>
      <div id="preview-container" class="grid-bg min-h-48 flex items-center justify-center p-8 rounded-xl" style="background: #0f0c29;">
       <p id="preview-text" class="pixel-text pixel-shadow font-pixel text-center text-2xl md:text-4xl blink-cursor" style="color: #10b981;"><span class="opacity-50 italic text-base" style="font-family: 'VT323', monospace;">Inserisci testo...</span></p>
      </div>
     </div><!-- Export Button --> <button id="copy-html-btn" class="w-full py-4 px-6 rounded-xl font-retro text-lg transition-all hover:scale-[1.02] active:scale-[0.98] shadow-xl" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: #ffffff;"> [📋] <span id="copy-btn-text">COPIA HTML</span> </button> <!-- Toast -->
     <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl font-retro opacity-0 transition-all duration-300 pointer-events-none shadow-xl" style="background: #10b981; color: #ffffff;">
      [✓] COPIATO!
     </div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      placeholder_text: 'Scrivi qui...',
      copy_button_text: 'COPIA HTML'
    };
    
    let config = { ...defaultConfig };
    
    let currentStyle = 'gameboy';
    let pixelColor = '#10b981';
    let bgColor = '#0f0c29';
    let pixelSize = 'medium';
    let showShadow = true;
    
    const stylePresets = {
      gameboy: { pixel: '#9bbc0f', bg: '#0f380f' },
      nes: { pixel: '#fcfcfc', bg: '#000000' },
      arcade: { pixel: '#ffed4e', bg: '#1a0033' },
      cyber: { pixel: '#00ffff', bg: '#0d0221' }
    };
    
    const sizeMap = {
      small: '1.5rem',
      medium: '2.5rem',
      large: '4rem'
    };
    
    const textInput = document.getElementById('text-input');
    const previewText = document.getElementById('preview-text');
    const previewContainer = document.getElementById('preview-container');
    const charCount = document.getElementById('char-count');
    const toast = document.getElementById('toast');
    
    function updatePreview() {
      const text = textInput.value.toUpperCase();
      charCount.textContent = text.length;
      
      if (!text.trim()) {
        previewText.innerHTML = '<span class="opacity-50 italic text-base" style="font-family: \'VT323\', monospace;">Inserisci testo...</span>';
        previewText.classList.add('blink-cursor');
        return;
      }
      
      previewText.classList.remove('blink-cursor');
      previewText.textContent = text;
      previewText.style.color = pixelColor;
      previewText.style.fontSize = sizeMap[pixelSize];
      previewContainer.style.background = bgColor;
      
      if (showShadow) {
        previewText.classList.add('pixel-shadow');
      } else {
        previewText.classList.remove('pixel-shadow');
      }
    }
    
    function applyStylePreset(style) {
      const preset = stylePresets[style];
      pixelColor = preset.pixel;
      bgColor = preset.bg;
      
      document.getElementById('pixel-color').value = pixelColor;
      document.getElementById('bg-color').value = bgColor;
      
      updatePreview();
    }
    
    function generateHTML() {
      const text = textInput.value.toUpperCase();
      if (!text.trim()) return '';
      
      const shadowCSS = showShadow ? `
      text-shadow: 
        2px 2px 0 rgba(0,0,0,0.3),
        4px 4px 0 rgba(0,0,0,0.2);` : '';
      
      return `<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: ${bgColor};
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: 
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    
    h1 {
      font-family: 'Press Start 2P', cursive;
      color: ${pixelColor};
      font-size: ${sizeMap[pixelSize]};
      text-align: center;
      line-height: 1.8;
      letter-spacing: 0.1em;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;${shadowCSS}
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>${text}</h1>
</body>
</html>`;
    }
    
    function showToast(message) {
      toast.textContent = message;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
      }, 2000);
    }
    
    // Event Listeners
    textInput.addEventListener('input', updatePreview);
    
    document.getElementById('style-selector').addEventListener('click', (e) => {
      const btn = e.target.closest('.style-btn');
      if (!btn) return;
      
      document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      applyStylePreset(currentStyle);
    });
    
    document.getElementById('pixel-color').addEventListener('input', (e) => {
      pixelColor = e.target.value;
      updatePreview();
    });
    
    document.getElementById('bg-color').addEventListener('input', (e) => {
      bgColor = e.target.value;
      updatePreview();
    });
    
    document.getElementById('size-select').addEventListener('change', (e) => {
      pixelSize = e.target.value;
      updatePreview();
    });
    
    document.getElementById('shadow-toggle').addEventListener('change', (e) => {
      showShadow = e.target.checked;
      updatePreview();
    });
    
    document.getElementById('clear-btn').addEventListener('click', () => {
      textInput.value = '';
      updatePreview();
      textInput.focus();
    });
    
    document.getElementById('copy-html-btn').addEventListener('click', () => {
      const html = generateHTML();
      if (!html) {
        showToast('[!] INSERISCI TESTO');
        return;
      }
      
      const textarea = document.createElement('textarea');
      textarea.value = html;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      
      try {
        document.execCommand('copy');
        showToast('[✓] HTML COPIATO!');
      } catch (err) {
        showToast('[X] ERRORE');
      }
      
      document.body.removeChild(textarea);
    });
    
    // SDK Integration
    async function onConfigChange(cfg) {
      const placeholder = cfg.placeholder_text || defaultConfig.placeholder_text;
      const copyBtnText = cfg.copy_button_text || defaultConfig.copy_button_text;
      
      textInput.placeholder = placeholder;
      document.getElementById('copy-btn-text').textContent = copyBtnText;
    }
    
    function mapToCapabilities(cfg) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }
    
    function mapToEditPanelValues(cfg) {
      return new Map([
        ['placeholder_text', cfg.placeholder_text || defaultConfig.placeholder_text],
        ['copy_button_text', cfg.copy_button_text || defaultConfig.copy_button_text]
      ]);
    }
    
    // Initialize
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
