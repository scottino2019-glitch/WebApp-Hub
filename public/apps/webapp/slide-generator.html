<!doctype html>
<html lang="it" class="h-full">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      box-sizing: border-box;
    }
    * {
      font-family: 'Outfit', sans-serif;
    }
    .slide-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .slide-card:hover {
      transform: translateY(-4px);
    }
    .emoji-btn {
      transition: all 0.2s ease;
    }
    .emoji-btn:hover {
      transform: scale(1.2);
    }
    .nav-btn {
      transition: all 0.2s ease;
    }
    .nav-btn:hover:not(:disabled) {
      transform: scale(1.1);
    }
    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.5s ease-out forwards;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(16, 185, 129, 0.95);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 1000;
      animation: slideInRight 0.3s ease-out;
    }
    @keyframes slideInRight {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/element_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">

      <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4">

        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />

      <div class="flex gap-3"><button id="cancel-delete-btn" class="flex-1 px-4 py-3 bg-slate-700 text-white font-medium rounded-xl hover:bg-slate-600 transition-colors"> Annulla </button> <button id="confirm-delete-btn" class="flex-1 px-4 py-3 bg-red-500 text-white font-medium rounded-xl hover:bg-red-600 transition-colors"> Elimina </button>
      </div>
     </div>

   <div id="presentation-view" class="hidden fixed inset-0 z-40" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
    <div class="h-full flex flex-col"><!-- Presentation Header -->
     <div class="flex items-center justify-between p-4 bg-black/20">
      <div class="flex items-center gap-4"><button id="exit-presentation-btn" class="p-2 hover:bg-white/10 rounded-lg transition-colors text-white">

        </svg></button> <span id="slide-counter" class="text-white/70 text-sm font-medium">1 / 1</span>
      </div>

         📌
        </div>
        <h2 id="pres-title" class="text-4xl md:text-5xl font-bold text-white mb-6"></h2>

     <div class="flex items-center justify-center gap-4 p-6"><button id="prev-slide-btn" class="nav-btn p-4 bg-white/10 hover:bg-white/20 rounded-full text-white transition-all">

       </svg></button>

      </div><button id="next-slide-btn" class="nav-btn p-4 bg-white/10 hover:bg-white/20 rounded-full text-white transition-all">
       <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">

       </svg></button>

    </div>

  <script>
    const emojis = ['📌', '🧾', '🎯', '🚀', '✨', '📊', '💪', '🎨', '🔥', '⭐', '💎', '🏆', '📈', '📝', '🎭', '🌟', '🛠️', '🔑', '🎬', '🌍', '💼', '🎓', '🔍', '📱', '🀄','🖍️','📘'];

    let slides = [];
    let currentSlideIndex = 0;
    let slideToDelete = null;
    let nextId = 1;

    // Load from localStorage
    function loadSlides() {
      const saved = localStorage.getItem('slides');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          slides = data.slides || [];
          nextId = data.nextId || 1;
        } catch (e) {
          slides = [];
          nextId = 1;
        }
      }
    }

    // Save to localStorage
    function saveSlides() {
      localStorage.setItem('slides', JSON.stringify({ slides, nextId }));
    }

    // DOM Elements
    const slidesGrid = document.getElementById('slides-grid');
    const emptyState = document.getElementById('empty-state');
    const slideModal = document.getElementById('slide-modal');
    const deleteModal = document.getElementById('delete-modal');
    const presentationView = document.getElementById('presentation-view');
    const editorView = document.getElementById('editor-view');
    const slideForm = document.getElementById('slide-form');
    const emojiPicker = document.getElementById('emoji-picker');

    // Show toast message
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Initialize emoji picker
    function initEmojiPicker() {
      emojiPicker.innerHTML = emojis.map(emoji => `
        <button type="button" class="emoji-btn p-2 text-2xl hover:bg-white/10 rounded-lg transition-all ${emoji === '📌' ? 'bg-emerald-500/30 ring-2 ring-emerald-500' : ''}" data-emoji="${emoji}">
          ${emoji}
        </button>
      `).join('');
      
      emojiPicker.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-emoji]');
        if (btn) {
          document.querySelectorAll('.emoji-btn').forEach(b => {
            b.classList.remove('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
          });
          btn.classList.add('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
          document.getElementById('slide-emoji').value = btn.dataset.emoji;
        }
      });
    }

    // Render slides
    function renderSlides() {
      if (slides.length === 0) {
        slidesGrid.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      
      emptyState.classList.add('hidden');
      
      slidesGrid.innerHTML = slides.map((slide, index) => `
        <div class="slide-card bg-slate-800/80 rounded-2xl p-5 border border-white/10 cursor-pointer animate-slide-up" data-slide-id="${slide.id}" style="animation-delay: ${index * 0.1}s">
          <div class="flex items-start justify-between mb-4">
            <span class="text-4xl">${slide.emoji || '📌'}</span>
            <span class="text-xs font-medium text-gray-500 bg-white/5 px-2 py-1 rounded-full">${index + 1}</span>
          </div>
          <h3 class="text-lg font-semibold text-white mb-2 line-clamp-2">${escapeHtml(slide.title) || 'Senza titolo'}</h3>
          ${slide.image ? `<img src="${escapeHtml(slide.image)}" alt="" class="w-full h-32 object-cover rounded-lg mb-3" onerror="this.style.display='none'">` : ''}
          <p class="text-gray-400 text-sm line-clamp-3 mb-4">${escapeHtml(slide.content) || 'Nessun contenuto'}</p>
          <div class="flex justify-end gap-2">
            <button class="slide-action-btn p-2 hover:bg-white/10 rounded-lg transition-colors text-gray-400 hover:text-white" data-action="edit" data-id="${slide.id}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button class="slide-action-btn p-2 hover:bg-red-500/20 rounded-lg transition-colors text-gray-400 hover:text-red-400" data-action="delete" data-id="${slide.id}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
          </div>
        </div>
      `).join('');
      
      // Add event listeners
      slidesGrid.querySelectorAll('.slide-card').forEach(card => {
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.slide-action-btn')) {
            const id = parseInt(card.dataset.slideId);
            const slide = slides.find(s => s.id === id);
            if (slide) openEditModal(slide);
          }
        });
      });
      
      slidesGrid.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          const slide = slides.find(s => s.id === id);
          if (slide) openEditModal(slide);
        });
      });
      
      slidesGrid.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          const slide = slides.find(s => s.id === id);
          if (slide) openDeleteModal(slide);
        });
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Modal functions
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Nuova Slide';
      document.getElementById('slide-title').value = '';
      document.getElementById('slide-content').value = '';
      document.getElementById('slide-image').value = '';
      document.getElementById('slide-emoji').value = '📌';
      document.getElementById('editing-slide-id').value = '';
      
      document.querySelectorAll('.emoji-btn').forEach(b => {
        b.classList.remove('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
        if (b.dataset.emoji === '📌') {
          b.classList.add('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
        }
      });
      
      slideModal.classList.remove('hidden');
    }

    function openEditModal(slide) {
      document.getElementById('modal-title').textContent = 'Modifica Slide';
      document.getElementById('slide-title').value = slide.title || '';
      document.getElementById('slide-content').value = slide.content || '';
      document.getElementById('slide-image').value = slide.image || '';
      document.getElementById('slide-emoji').value = slide.emoji || '📌';
      document.getElementById('editing-slide-id').value = slide.id;
      
      document.querySelectorAll('.emoji-btn').forEach(b => {
        b.classList.remove('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
        if (b.dataset.emoji === (slide.emoji || '📌')) {
          b.classList.add('bg-emerald-500/30', 'ring-2', 'ring-emerald-500');
        }
      });
      
      slideModal.classList.remove('hidden');
    }

    function closeModal() {
      slideModal.classList.add('hidden');
    }

    function openDeleteModal(slide) {
      slideToDelete = slide;
      deleteModal.classList.remove('hidden');
    }

    function closeDeleteModal() {
      slideToDelete = null;
      deleteModal.classList.add('hidden');
    }

    // Save slide
    function saveSlide(e) {
      e.preventDefault();
      
      const title = document.getElementById('slide-title').value.trim();
      const content = document.getElementById('slide-content').value.trim();
      const image = document.getElementById('slide-image').value.trim();
      const emoji = document.getElementById('slide-emoji').value;
      const editingId = document.getElementById('editing-slide-id').value;
      
      if (!title && !content) {
        return;
      }
      
      if (editingId) {
        const index = slides.findIndex(s => s.id === parseInt(editingId));
        if (index !== -1) {
          slides[index] = { ...slides[index], title, content, image, emoji };
          showToast('Slide aggiornata!');
        }
      } else {
        slides.push({
          id: nextId++,
          title,
          content,
          image,
          emoji,
          createdAt: new Date().toISOString()
        });
        showToast('Slide creata!');
      }
      
      saveSlides();
      renderSlides();
      closeModal();
    }

    // Delete slide
    function deleteSlide() {
      if (!slideToDelete) return;
      
      slides = slides.filter(s => s.id !== slideToDelete.id);
      saveSlides();
      renderSlides();
      closeDeleteModal();
      showToast('Slide eliminata!');
    }

    // Export to HTML
    function exportToHTML() {
      if (slides.length === 0) {
        showToast('Crea almeno una slide prima di esportare!');
        return;
      }

      const slidesHTML = slides.map((slide, index) => `
    <div class="slide ${index === 0 ? 'active' : ''}" data-index="${index}">
      <div class="slide-content">
        <div class="emoji">${slide.emoji || '📌'}</div>
        <h2 class="title">${escapeHtml(slide.title) || 'Senza titolo'}</h2>
        ${slide.image ? `<img src="${escapeHtml(slide.image)}" alt="" class="slide-image" onerror="this.style.display='none'">` : ''}
        <p class="content">${escapeHtml(slide.content) || ''}</p>
      </div>
    </div>`).join('');

      const html = `<!DOCTYPE html>

<head>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0,0,0,0.2);
