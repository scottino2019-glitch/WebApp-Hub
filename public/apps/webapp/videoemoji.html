<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji & Text Animator Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts per font artistici -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Creepster&family=Lobster&family=Pacifico&family=Press+Start+2P&family=Righteous&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        #canvasContainer {
            background: #1e293b;
            border-radius: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #334155;
        }
        input[type=range] { cursor: pointer; }
        .control-label { @apply block text-[10px] font-bold uppercase text-slate-400 mb-1 tracking-wider; }
        .custom-input { @apply w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-2xl bg-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl border border-slate-700">
        <h1 class="text-3xl font-black text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 tracking-tight italic">
            EMOJI & TEXT ANIMATOR
        </h1>

        <!-- Area Preview -->
        <div class="flex flex-col items-center mb-8">
            <div id="canvasContainer">
                <canvas id="mainCanvas" width="400" height="400" class="max-w-full h-auto"></canvas>
            </div>
            <p id="statusMsg" class="mt-4 text-sm text-indigo-300 font-bold h-5 animate-pulse"></p>
        </div>

        <!-- Pannello Controlli -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Colonna 1: Contenuto e Stile -->
            <div class="space-y-4">
                <div class="flex gap-2">
                    <div class="flex-[1]">
                        <label class="control-label">Emoji</label>
                        <input type="text" id="emojiInput" value="🚀" class="custom-input text-2xl text-center">
                    </div>
                    <div class="flex-[3]">
                        <label class="control-label">Testo</label>
                        <input type="text" id="textInput" placeholder="Scrivi qui..." value="SPAZIALE!" class="custom-input">
                    </div>
                </div>

                <div>
                    <label class="control-label">Font Artistico</label>
                    <select id="fontFamily" class="custom-input">
                        <option value="Arial">Standard (Sans)</option>
                        <option value="'Bungee Spice'">Bungee Spice (Color)</option>
                        <option value="'Pacifico'">Pacifico (Corsivo)</option>
                        <option value="'Press Start 2P'">8-Bit Style</option>
                        <option value="'Righteous'">Moderno</option>
                        <option value="'Lobster'">Elegante</option>
                        <option value="'Creepster'">Horror</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="control-label">Sfondo</label>
                        <input type="color" id="bgColor" value="#ffffff" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer">
                    </div>
                    <div class="flex-1">
                        <label class="control-label">Colore Testo</label>
                        <input type="color" id="textColor" value="#4f46e5" class="w-full h-10 bg-slate-900 border border-slate-700 rounded-lg p-1 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Colonna 2: Animazione e Dimensioni -->
            <div class="space-y-4">
                <div>
                    <label class="control-label">Tipo Animazione</label>
                    <select id="animType" class="custom-input">
                        <option value="bounce">Rimbalzo</option>
                        <option value="spin">Rotazione</option>
                        <option value="pulse">Pulsazione</option>
                        <option value="float">Fluttuazione</option>
                        <option value="shake">Vibrazione</option>
                    </select>
                </div>

                <div>
                    <label class="control-label">Velocità Animazione</label>
                    <input type="range" id="speed" min="0.5" max="8" step="0.5" value="3" class="w-full accent-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="control-label">Size Emoji</label>
                        <input type="range" id="emojiSize" min="20" max="250" step="5" value="120" class="w-full accent-indigo-500">
                    </div>
                    <div>
                        <label class="control-label">Size Testo</label>
                        <input type="range" id="textSize" min="10" max="100" step="2" value="40" class="w-full accent-indigo-500">
                    </div>
                </div>
            </div>
        </div>

        <button id="downloadBtn" class="w-full mt-8 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black py-4 rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            ESPORTA VIDEO (WEBM)
        </button>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        
        // Elementi UI
        const emojiInput = document.getElementById('emojiInput');
        const textInput = document.getElementById('textInput');
        const bgColorInput = document.getElementById('bgColor');
        const textColorInput = document.getElementById('textColor');
        const fontFamilyInput = document.getElementById('fontFamily');
        const animType = document.getElementById('animType');
        const speedInput = document.getElementById('speed');
        const emojiSizeInput = document.getElementById('emojiSize');
        const textSizeInput = document.getElementById('textSize');
        const downloadBtn = document.getElementById('downloadBtn');
        const statusMsg = document.getElementById('statusMsg');

        let isRecording = false;

        function renderFrame(time) {
            const speed = parseFloat(speedInput.value);
            const eSize = parseInt(emojiSizeInput.value);
            const tSize = parseInt(textSizeInput.value);
            const emoji = emojiInput.value || "";
            const text = textInput.value || "";
            const type = animType.value;
            const font = fontFamilyInput.value;

            // Sfondo
            ctx.fillStyle = bgColorInput.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            const t = time / (1000 / speed);
            
            // Logica Animazioni
            if (type === 'bounce') {
                ctx.translate(0, Math.abs(Math.sin(t)) * -80);
            } else if (type === 'spin') {
                ctx.rotate(t);
            } else if (type === 'pulse') {
                const s = 1 + Math.sin(t) * 0.15;
                ctx.scale(s, s);
            } else if (type === 'float') {
                ctx.translate(Math.sin(t) * 30, Math.cos(t * 0.7) * 30);
            } else if (type === 'shake') {
                ctx.translate(Math.random() * 4 - 2, Math.random() * 4 - 2);
                ctx.rotate(Math.sin(t * 5) * 0.05);
            }

            // Disegno Emoji
            ctx.font = `${eSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(emoji, 0, -20); // Spostata leggermente su per far spazio al testo

            // Disegno Testo
            if (text) {
                ctx.font = `${tSize}px ${font}`;
                ctx.fillStyle = textColorInput.value;
                ctx.fillText(text, 0, (eSize/2) + 10);
            }

            ctx.restore();
        }

        function loop(time) {
            renderFrame(time);
            requestAnimationFrame(loop);
        }

        // Avvio Loop
        requestAnimationFrame(loop);

        // Registrazione Video
        downloadBtn.onclick = () => {
            if (isRecording) return;
            
            isRecording = true;
            const stream = canvas.captureStream(60);
            const recorder = new MediaRecorder(stream, {
                mimeType: 'video/webm;codecs=vp9'
            });
            const chunks = [];

            recorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `animazione_${Date.now()}.webm`;
                a.click();
                
                statusMsg.textContent = "✅ Download completato!";
                setTimeout(() => statusMsg.textContent = "", 3000);
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-50');
                isRecording = false;
            };

            statusMsg.textContent = "🔴 Registrazione in corso (5s)...";
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-50');

            recorder.start();
            // Registriamo un loop di 5 secondi per sicurezza
            setTimeout(() => recorder.stop(), 5000);
        };
    </script>
</body>
</html>
