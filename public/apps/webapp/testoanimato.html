<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji & Text Web Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&family=Creepster&family=Lobster&family=Pacifico&family=Press+Start+2P&family=Righteous&display=swap" rel="stylesheet">
    <style>
        .checkerboard {
            background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                              linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        /* Animazione applicata solo al contenitore di anteprima */
        #previewContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 1rem;
            transform-origin: center;
        }

        .custom-input { @apply w-full bg-slate-50 border-2 border-slate-100 rounded-xl p-3 outline-none focus:border-blue-500 transition-all text-slate-700; }
        .label-style { @apply block text-[10px] font-bold text-slate-400 uppercase mb-1 ml-1; }
        
        /* Stile per i bottoni rapidi delle emoji */
        .emoji-btn { @apply p-2 hover:bg-slate-100 rounded-lg transition-colors text-2xl; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex items-center justify-center font-sans">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Configurazione (Statica per facile modifica) -->
        <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-200">
            <h1 class="text-2xl font-black text-slate-800 mb-6 flex items-center gap-2">
                <span class="bg-blue-600 text-white p-2 rounded-lg text-sm">JS</span> 
                Configuratore Web
            </h1>
            
            <div class="space-y-4">
                <div>
                    <label class="label-style">Scrivi o Scegli Emoji</label>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="emojiIn" value="⭐" class="custom-input text-2xl text-center w-24">
                        <div class="flex flex-wrap gap-1 bg-slate-50 p-1 rounded-xl border-2 border-slate-100 flex-1 justify-center">
                            <button class="emoji-btn" onclick="setEmoji('🔥')">🔥</button>
                            <button class="emoji-btn" onclick="setEmoji('🚀')">🚀</button>
                            <button class="emoji-btn" onclick="setEmoji('💎')">💎</button>
                            <button class="emoji-btn" onclick="setEmoji('✨')">✨</button>
                            <button class="emoji-btn" onclick="setEmoji('❤️')">❤️</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="label-style">Testo personalizzato</label>
                    <input type="text" id="textIn" value="ANIMATO!" class="custom-input font-bold">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label-style">Font Artistico</label>
                        <select id="fontIn" class="custom-input">
                            <option value="Arial">Standard</option>
                            <option value="'Bungee Spice'">Bungee Spice</option>
                            <option value="'Pacifico'">Pacifico</option>
                            <option value="'Press Start 2P'">8-Bit</option>
                            <option value="'Righteous'">Moderno</option>
                            <option value="'Lobster'">Elegante</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-style">Animazione</label>
                        <select id="animType" class="custom-input">
                            <option value="bounce">Rimbalzo</option>
                            <option value="spin">Rotazione</option>
                            <option value="pulse">Pulsazione</option>
                            <option value="float">Fluttuazione</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="label-style">Sfondo</label>
                        <input type="color" id="bgIn" value="#ffffff" class="w-full h-12 rounded-xl cursor-pointer bg-white border-2 border-slate-100 p-1">
                    </div>
                    <div>
                        <label class="label-style">Colore Testo</label>
                        <input type="color" id="colorIn" value="#2563eb" class="w-full h-12 rounded-xl cursor-pointer bg-white border-2 border-slate-100 p-1">
                    </div>
                    <div>
                        <label class="label-style">Velocità (s)</label>
                        <input type="number" id="durIn" value="1.5" step="0.1" min="0.1" class="custom-input">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="label-style">Grandezza Emoji</label>
                        <input type="range" id="sizeEIn" min="20" max="150" value="80" class="w-full accent-blue-600">
                    </div>
                    <div>
                        <label class="label-style">Grandezza Testo</label>
                        <input type="range" id="sizeTIn" min="10" max="80" value="30" class="w-full accent-blue-600">
                    </div>
                </div>

                <button id="copyBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-3 mt-4">
                    COPIA CODICE EMBED
                </button>
            </div>
        </div>

        <!-- Anteprima (Animata) -->
        <div class="flex flex-col gap-6">
            <div class="bg-white rounded-3xl shadow-xl p-6 border border-slate-200 flex-1 flex flex-col">
                <span class="label-style">Anteprima Risultato</span>
                <div class="checkerboard rounded-2xl flex-1 flex items-center justify-center min-h-[300px] border border-slate-100 overflow-hidden">
                    <div id="previewContainer">
                        <span id="pEmoji">⭐</span>
                        <span id="pText">ANIMATO!</span>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900 rounded-3xl shadow-xl p-6 border border-slate-800">
                <span class="label-style text-slate-500">Codice Generato</span>
                <textarea id="codeOut" readonly class="w-full h-32 bg-slate-950 text-emerald-400 font-mono text-[10px] p-4 rounded-xl border border-slate-800 outline-none focus:border-emerald-900 mt-2"></textarea>
                <div id="msg" class="text-center text-emerald-400 text-xs font-bold mt-2 h-4 opacity-0 transition-opacity">Copiato!</div>
            </div>
        </div>
    </div>

    <script>
        const inputs = ['emojiIn', 'textIn', 'fontIn', 'animType', 'bgIn', 'colorIn', 'durIn', 'sizeEIn', 'sizeTIn'];
        const elements = {};
        inputs.forEach(id => elements[id] = document.getElementById(id));

        const pEmoji = document.getElementById('pEmoji');
        const pText = document.getElementById('pText');
        const pContainer = document.getElementById('previewContainer');
        const codeOut = document.getElementById('codeOut');
        const copyBtn = document.getElementById('copyBtn');
        const msg = document.getElementById('msg');

        const keyframes = {
            bounce: `@keyframes preview-anim {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-30px); }
}`,
            spin: `@keyframes preview-anim {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}`,
            pulse: `@keyframes preview-anim {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}`,
            float: `@keyframes preview-anim {
  0%, 100% { transform: translate(0,0); }
  50% { transform: translate(15px, -20px); }
}`
        };

        function setEmoji(emoji) {
            elements.emojiIn.value = emoji;
            update();
        }

        function update() {
            const e = elements;
            
            // 1. Aggiorna testi e stili nell'anteprima
            pEmoji.textContent = e.emojiIn.value || " ";
            pEmoji.style.fontSize = e.sizeEIn.value + 'px';
            
            pText.textContent = e.textIn.value || "";
            pText.style.fontSize = e.sizeTIn.value + 'px';
            pText.style.color = e.colorIn.value;
            pText.style.fontFamily = e.fontIn.value;
            
            pContainer.style.backgroundColor = e.bgIn.value;
            
            // 2. Aggiorna l'animazione solo sull'anteprima
            const styleId = 'dynamic-preview-style';
            let styleTag = document.getElementById(styleId) || document.createElement('style');
            styleTag.id = styleId;
            document.head.appendChild(styleTag);
            
            styleTag.textContent = `
                ${keyframes[e.animType.value]}
                #previewContainer {
                    animation: preview-anim ${e.durIn.value}s infinite ease-in-out;
                    ${e.animType.value === 'spin' ? 'animation-timing-function: linear;' : ''}
                }
            `;

            // 3. Genera Codice per il sito
            const cleanFont = e.fontIn.value.replace(/'/g, "");
            const fontImport = e.fontIn.value !== 'Arial' ? `@import url('https://fonts.googleapis.com/css2?family=${cleanFont.replace(/ /g, "+")}&display=swap');\n` : '';

            const generatedHTML = `<div class="emoji-web-widget">
  <span class="ew-icon">${e.emojiIn.value}</span>
  <span class="ew-text">${e.textIn.value}</span>
</div>

<style>
${fontImport}.emoji-web-widget {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: ${e.bgIn.value};
  border-radius: 15px;
  animation: ew-anim ${e.durIn.value}s infinite ease-in-out;
  ${e.animType.value === 'spin' ? 'animation-timing-function: linear;' : ''}
}
.ew-icon {
  font-size: ${e.sizeEIn.value}px;
  line-height: 1;
}
.ew-text {
  font-family: ${e.fontIn.value}, sans-serif;
  font-size: ${e.sizeTIn.value}px;
  color: ${e.colorIn.value};
  margin-top: 8px;
}
@keyframes ew-anim {
${keyframes[e.animType.value].split('{').slice(1).join('{')}
</style>`;

            codeOut.value = generatedHTML;
        }

        inputs.forEach(id => elements[id].addEventListener('input', update));

        copyBtn.onclick = () => {
            codeOut.select();
            document.execCommand('copy');
            msg.style.opacity = "1";
            setTimeout(() => msg.style.opacity = "0", 2000);
        };

        update();
    </script>
</body>
</html>
