<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Crypto & Base64 Studio</title>
  <style>
    :root {
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --bg: #090514;
      --surface: #170d2b;
      --border: #2e1a53;
      --text: #f5f3ff;
      --muted: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand h1 { font-size: 1.25rem; color: var(--accent); }
    .brand p { font-size: 0.85rem; color: var(--muted); }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 700;
    }
    textarea {
      width: 100%;
      height: 180px;
      background: #0d061c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: #241442;
      color: #fff;
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #351e61; border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      color: #090514;
      font-weight: 700;
      border: none;
    }
    button.primary:hover { background: var(--accent-hover); }
    .hash-result {
      background: #0d061c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hash-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; }
    .hash-val {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      color: #38bdf8;
      word-break: break-all;
      user-select: all;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Crypto & Base64 Developer Tool</h1>
      <p>Codifica, decodifica ed esegui hashing SHA-256 / SHA-1 in locale nel browser</p>
    </div>
    <button class="primary" onclick="generateUUID()">Genera UUID v4</button>
  </header>

  <div class="layout">
    <div class="card">
      <div class="card-title">Testo Input / Sorgente</div>
      <textarea id="srcText" placeholder="Inserisci qui il testo da convertire o calcolare l'hash...">Benvenuto in WebApps Hub!</textarea>
      <div class="btn-row">
        <button onclick="encodeBase64()">Encode Base64</button>
        <button onclick="decodeBase64()">Decode Base64</button>
        <button onclick="encodeURL()">URL Encode</button>
        <button onclick="decodeURL()">URL Decode</button>
        <button onclick="calcHashes()">Ricalcola Hash</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Risultato Trasformazione / Hashing</div>
      <textarea id="resText" placeholder="Il risultato apparirà qui..."></textarea>
      <div class="btn-row">
        <button class="primary" onclick="copyResult()">Copia Risultato</button>
        <button onclick="swapTexts()">Inverti con Input</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Firme Crittografiche (Web Crypto API)</div>
    <div class="hash-result">
      <div class="hash-label">SHA-256 Hash</div>
      <div class="hash-val" id="sha256Val">-</div>
    </div>
    <div class="hash-result">
      <div class="hash-label">SHA-1 Hash</div>
      <div class="hash-val" id="sha1Val">-</div>
    </div>
  </div>

  <script>
    const src = document.getElementById('srcText');
    const res = document.getElementById('resText');
    const sha256Val = document.getElementById('sha256Val');
    const sha1Val = document.getElementById('sha1Val');

    function encodeBase64() {
      try {
        res.value = btoa(unescape(encodeURIComponent(src.value)));
      } catch (e) {
        res.value = 'Errore codifica: ' + e.message;
      }
    }

    function decodeBase64() {
      try {
        res.value = decodeURIComponent(escape(atob(src.value.trim())));
      } catch (e) {
        res.value = 'Errore decodifica: stringa Base64 non valida';
      }
    }

    function encodeURL() {
      res.value = encodeURIComponent(src.value);
    }

    function decodeURL() {
      try {
        res.value = decodeURIComponent(src.value);
      } catch (e) {
        res.value = 'Errore: sequenza URL non valida';
      }
    }

    function swapTexts() {
      const temp = src.value;
      src.value = res.value;
      res.value = temp;
      calcHashes();
    }

    function copyResult() {
      navigator.clipboard.writeText(res.value);
      alert('Risultato copiato negli appunti!');
    }

    function generateUUID() {
      const uuid = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
      src.value = uuid;
      res.value = uuid;
      calcHashes();
    }

    async function hash(algo, string) {
      const utf8 = new TextEncoder().encode(string);
      const hashBuffer = await crypto.subtle.digest(algo, utf8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function calcHashes() {
      const val = src.value;
      if (!val) {
        sha256Val.textContent = '-';
        sha1Val.textContent = '-';
        return;
      }
      sha256Val.textContent = await hash('SHA-256', val);
      sha1Val.textContent = await hash('SHA-1', val);
    }

    src.addEventListener('input', () => {
      calcHashes();
    });

    encodeBase64();
    calcHashes();
  </script>
</body>
</html>
