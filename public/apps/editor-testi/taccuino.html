<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taccuino Digitale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        
        .notebook-lines {
            background-image: repeating-linear-gradient(
                transparent,
                transparent 24px,
                #e5e7eb 24px,
                #e5e7eb 25px
            );
        }
        
        .note-card {
            transition: all 0.3s ease;
        }
        
        .note-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 to-orange-100 min-h-full font-serif">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-amber-800 mb-2">📔 Il Mio Taccuino</h1>
            <p class="text-amber-600">Scrivi, salva e organizza i tuoi pensieri</p>
        </div>

        <!-- Nuova Nota -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8 border-l-4 border-amber-500">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">✍️ Nuova Nota</h2>
            
            <div class="mb-4">
                <input type="text" id="noteTitle" placeholder="Titolo della nota..." 
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent text-lg font-medium">
            </div>
            
            <div class="mb-4">
                <select id="noteCategory" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
                    <option value="personale">📝 Personale</option>
                    <option value="lavoro">💼 Lavoro</option>
                    <option value="idee">💡 Idee</option>
                    <option value="ricordi">🌟 Ricordi</option>
                    <option value="altro">📋 Altro</option>
                </select>
            </div>
            
            <div class="mb-4">
                <textarea id="noteContent" placeholder="Scrivi qui la tua nota..." 
                          class="w-full h-40 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent resize-none notebook-lines leading-6"
                          style="line-height: 25px; padding-top: 12px;"></textarea>
            </div>
            
            <div class="flex gap-3">
                <button onclick="saveNote()" 
                        class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-lg font-medium transition-colors flex items-center gap-2">
                    💾 Salva Nota
                </button>
                <button onclick="clearForm()" 
                        class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    🗑️ Cancella
                </button>
            </div>
        </div>

        <!-- Filtri -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-wrap gap-4 items-center">
                <span class="font-medium text-gray-700">Filtra per:</span>
                <select id="filterCategory" onchange="filterNotes()" 
                        class="p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                    <option value="tutte">Tutte le categorie</option>
                    <option value="personale">📝 Personale</option>
                    <option value="lavoro">💼 Lavoro</option>
                    <option value="idee">💡 Idee</option>
                    <option value="ricordi">🌟 Ricordi</option>
                    <option value="altro">📋 Altro</option>
                </select>
                
                <input type="text" id="searchInput" placeholder="Cerca nelle note..." 
                       onkeyup="searchNotes()"
                       class="p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 flex-1 min-w-48">
                
                <span id="noteCount" class="text-sm text-gray-600 font-medium"></span>
            </div>
        </div>

        <!-- Lista Note -->
        <div id="notesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Le note verranno inserite qui dinamicamente -->
        </div>

        <!-- Messaggio quando non ci sono note -->
        <div id="emptyMessage" class="text-center py-12 hidden">
            <div class="text-6xl mb-4">📝</div>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">Nessuna nota trovata</h3>
            <p class="text-gray-500">Inizia scrivendo la tua prima nota!</p>
        </div>
    </div>

    <!-- Modal per visualizzare/modificare note -->
    <div id="noteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-full overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-bold text-gray-800">Visualizza Nota</h3>
                    <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 text-2xl">×</button>
                </div>
                
                <div class="mb-4">
                    <input type="text" id="modalTitle" 
                           class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 text-lg font-medium">
                </div>
                
                <div class="mb-4">
                    <select id="modalCategory" class="p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500">
                        <option value="personale">📝 Personale</option>
                        <option value="lavoro">💼 Lavoro</option>
                        <option value="idee">💡 Idee</option>
                        <option value="ricordi">🌟 Ricordi</option>
                        <option value="altro">📋 Altro</option>
                    </select>
                </div>
                
                <div class="mb-6">
                    <textarea id="modalContent" 
                              class="w-full h-48 p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 resize-none notebook-lines leading-6"
                              style="line-height: 25px; padding-top: 12px;"></textarea>
                </div>
                
                <div class="flex gap-3 justify-end">
                    <button onclick="updateNote()" 
                            class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                        💾 Salva Modifiche
                    </button>
                    <button onclick="deleteNote()" 
                            class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                        🗑️ Elimina
                    </button>
                    <button onclick="closeModal()" 
                            class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg font-medium transition-colors">
                        Chiudi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('digitalNotebook') || '[]');
        let currentNoteId = null;

        const categoryEmojis = {
            'personale': '📝',
            'lavoro': '💼',
            'idee': '💡',
            'ricordi': '🌟',
            'altro': '📋'
        };

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            const category = document.getElementById('noteCategory').value;

            if (!title || !content) {
                alert('Per favore, inserisci sia il titolo che il contenuto della nota.');
                return;
            }

            const note = {
                id: Date.now(),
                title: title,
                content: content,
                category: category,
                date: new Date().toLocaleDateString('it-IT'),
                time: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
            };

            notes.unshift(note);
            localStorage.setItem('digitalNotebook', JSON.stringify(notes));
            
            clearForm();
            displayNotes();
            
            // Animazione di successo
            const button = event.target;
            const originalText = button.innerHTML;
            button.innerHTML = '✅ Salvata!';
            button.classList.add('bg-green-600');
            setTimeout(() => {
                button.innerHTML = originalText;
                button.classList.remove('bg-green-600');
            }, 2000);
        }

        function clearForm() {
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteCategory').value = 'personale';
        }

        function displayNotes(notesToShow = notes) {
            const notesList = document.getElementById('notesList');
            const emptyMessage = document.getElementById('emptyMessage');
            const noteCount = document.getElementById('noteCount');

            noteCount.textContent = `${notesToShow.length} ${notesToShow.length === 1 ? 'nota' : 'note'}`;

            if (notesToShow.length === 0) {
                notesList.innerHTML = '';
                emptyMessage.classList.remove('hidden');
                return;
            }

            emptyMessage.classList.add('hidden');
            
            notesList.innerHTML = notesToShow.map(note => `
                <div class="note-card bg-white rounded-lg shadow-md p-5 border-l-4 border-amber-400 cursor-pointer fade-in" 
                     onclick="openNoteModal(${note.id})">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-lg text-gray-800 line-clamp-2">${note.title}</h3>
                        <span class="text-2xl">${categoryEmojis[note.category]}</span>
                    </div>
                    
                    <p class="text-gray-600 mb-4 line-clamp-3 leading-relaxed">${note.content}</p>
                    
                    <div class="flex justify-between items-center text-sm text-gray-500">
                        <span class="bg-gray-100 px-2 py-1 rounded-full text-xs font-medium">
                            ${categoryEmojis[note.category]} ${note.category.charAt(0).toUpperCase() + note.category.slice(1)}
                        </span>
                        <span>${note.date} • ${note.time}</span>
                    </div>
                </div>
            `).join('');
        }

        function openNoteModal(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;

            currentNoteId = noteId;
            
            document.getElementById('modalTitle').value = note.title;
            document.getElementById('modalContent').value = note.content;
            document.getElementById('modalCategory').value = note.category;
            
            document.getElementById('noteModal').classList.remove('hidden');
            document.getElementById('noteModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('noteModal').classList.add('hidden');
            document.getElementById('noteModal').classList.remove('flex');
            currentNoteId = null;
        }

        function updateNote() {
            if (!currentNoteId) return;

            const title = document.getElementById('modalTitle').value.trim();
            const content = document.getElementById('modalContent').value.trim();
            const category = document.getElementById('modalCategory').value;

            if (!title || !content) {
                alert('Per favore, inserisci sia il titolo che il contenuto della nota.');
                return;
            }

            const noteIndex = notes.findIndex(n => n.id === currentNoteId);
            if (noteIndex !== -1) {
                notes[noteIndex] = {
                    ...notes[noteIndex],
                    title: title,
                    content: content,
                    category: category
                };
                
                localStorage.setItem('digitalNotebook', JSON.stringify(notes));
                displayNotes();
                closeModal();
            }
        }

        function deleteNote() {
            if (!currentNoteId) return;

            if (confirm('Sei sicuro di voler eliminare questa nota?')) {
                notes = notes.filter(n => n.id !== currentNoteId);
                localStorage.setItem('digitalNotebook', JSON.stringify(notes));
                displayNotes();
                closeModal();
            }
        }

        function filterNotes() {
            const selectedCategory = document.getElementById('filterCategory').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredNotes = notes;
            
            if (selectedCategory !== 'tutte') {
                filteredNotes = filteredNotes.filter(note => note.category === selectedCategory);
            }
            
            if (searchTerm) {
                filteredNotes = filteredNotes.filter(note => 
                    note.title.toLowerCase().includes(searchTerm) || 
                    note.content.toLowerCase().includes(searchTerm)
                );
            }
            
            displayNotes(filteredNotes);
        }

        function searchNotes() {
            filterNotes();
        }

        // Chiudi modal cliccando fuori
        document.getElementById('noteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Carica le note all'avvio
        displayNotes();
    </script>

</html>
