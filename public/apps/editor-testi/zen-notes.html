<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zen Notes</title>
  <style>
    :root {
      --accent: #d97706;
      --bg: #f8fafc;
      --paper: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    body.dark {
      --bg: #0f172a;
      --paper: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.2s ease;
    }
    .zen-nav {
      width: 100%;
      max-width: 860px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .zen-logo {
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-size: 1.15rem;
    }
    .zen-tools {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      background: var(--paper);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.15s ease;
    }
    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .container {
      width: 100%;
      max-width: 860px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 24px 32px;
    }
    input#docTitle {
      background: transparent;
      border: none;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text);
      outline: none;
      margin-bottom: 16px;
      padding: 8px 0;
      border-bottom: 2px solid transparent;
    }
    input#docTitle:focus { border-color: var(--accent); }
    textarea#docBody {
      flex: 1;
      width: 100%;
      background: var(--paper);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      font-size: 1.1rem;
      line-height: 1.8;
      outline: none;
      resize: none;
      min-height: 520px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: border 0.15s;
    }
    textarea#docBody:focus { border-color: var(--accent); }
    .footer-bar {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--muted);
      align-items: center;
    }
    .status-msg {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="zen-nav">
    <div class="zen-logo">ZEN NOTES</div>
    <div class="zen-tools">
      <button onclick="toggleTheme()" id="themeBtn">Modalità Scura</button>
      <button onclick="downloadNote()">Scarica TXT</button>
      <button onclick="clearNote()">Nuovo</button>
    </div>
  </div>

  <div class="container">
    <input type="text" id="docTitle" placeholder="Titolo della nota..." value="Appunti e Idee di Progetto" />
    <textarea id="docBody" placeholder="Scrivi liberamente senza distrazioni... Il testo viene salvato automaticamente in locale."></textarea>
    <div class="footer-bar">
      <div id="stats">0 parole · 0 caratteri</div>
      <div id="saveStatus" class="status-msg">Salvato in locale</div>
    </div>
  </div>

  <script>
    const title = document.getElementById('docTitle');
    const body = document.getElementById('docBody');
    const stats = document.getElementById('stats');
    const status = document.getElementById('saveStatus');

    function update() {
      const text = body.value;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      stats.textContent = `${words} parole · ${text.length} caratteri`;
      localStorage.setItem('zen_note_title', title.value);
      localStorage.setItem('zen_note_body', text);
      status.textContent = 'Modifiche salvate';
      setTimeout(() => { status.textContent = 'Salvato in locale'; }, 1500);
    }

    title.addEventListener('input', update);
    body.addEventListener('input', update);

    const savedTitle = localStorage.getItem('zen_note_title');
    const savedBody = localStorage.getItem('zen_note_body');
    if (savedTitle !== null) title.value = savedTitle;
    if (savedBody !== null) {
      body.value = savedBody;
    } else {
      body.value = `Questa è la tua stanza digitale senza distrazioni.\n\nPrendi appunti, scrivi un articolo, progetta il tuo codice o crea una to-do list.\nTutto ciò che scrivi resta nel tuo browser e viene preservato alla chiusura.`;
    }
    update();

    let isDark = false;
    function toggleTheme() {
      isDark = !isDark;
      document.body.classList.toggle('dark', isDark);
      document.getElementById('themeBtn').textContent = isDark ? 'Modalità Chiara' : 'Modalità Scura';
    }

    function downloadNote() {
      const content = `${title.value}\n\n${'='.repeat(title.value.length)}\n\n${body.value}`;
      const blob = new Blob([content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title.value.toLowerCase().replace(/[^a-z0-9]/g, '_') || 'nota'}.txt`;
      a.click();
    }

    function clearNote() {
      if (confirm('Vuoi creare una nuova nota vuota?')) {
        title.value = '';
        body.value = '';
        update();
      }
    }
  </script>
</body>
</html>
