<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Editor HTML/CSS/JS</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 10px;
        background-color: #f4f4f4;
    }
    .code-area {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .code-block {
        flex: 1 1 30%;
        display: flex;
        flex-direction: column;
    }
    textarea {
        width: 100%;
        height: 200px;
        font-family: monospace;
        padding: 10px;
        box-sizing: border-box;
        resize: vertical;
    }
    label {
        font-weight: bold;
        margin-bottom: 5px;
    }
    .buttons {
        margin: 15px 0;
        display: flex;
        gap: 10px;
    }
    button {
        padding: 10px;
        cursor: pointer;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
    }
    button:hover {
        background-color: #45a049;
    }
    iframe {
        width: 100%;
        height: 350px;
        border: 1px solid #ccc;
        background-color: white;
    }
</style>
</head>
<body>

<h1>Mini Editor HTML / CSS / JavaScript</h1>

<div class="code-area">
    <div class="code-block">
        <label>HTML</label>
        <textarea id="htmlCode"><h1>Ciao Mondo!</h1></textarea>
    </div>
    <div class="code-block">
        <label>CSS</label>
        <textarea id="cssCode">h1 { color: blue; }</textarea>
    </div>
    <div class="code-block">
        <label>JavaScript</label>
        <textarea id="jsCode">console.log("Funziona!");</textarea>
    </div>
</div>

<div class="buttons">
    <button onclick="updatePreview()">🔄 Aggiorna anteprima</button>
    <button onclick="downloadCode()">💾 Esporta HTML</button>
</div>

<iframe id="preview"></iframe>

<script>
    function updatePreview() {
        const html = document.getElementById('htmlCode').value;
        const css = "<style>" + document.getElementById('cssCode').value + "</style>";
        const js = "<script>" + document.getElementById('jsCode').value + "<\/script>";
        const previewFrame = document.getElementById('preview').contentWindow.document;
        previewFrame.open();
        previewFrame.write(html + css + js);
        previewFrame.close();
    }

    function downloadCode() {
        const html = document.getElementById('htmlCode').value;
        const css = "<style>\n" + document.getElementById('cssCode').value + "\n</style>";
        const js = "<script>\n" + document.getElementById('jsCode').value + "\n<\/script>";

        const fullHTML = `<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Documento esportato</title>
${css}
</head>
<body>
${html}
${js}
</body>
</html>`;

        const blob = new Blob([fullHTML], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "progetto.html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Anteprima in tempo reale
    document.querySelectorAll("textarea").forEach(area => {
        area.addEventListener("input", updatePreview);
    });

    // Inizializza la prima anteprima
    updatePreview();
</script>

</body>
</html>
