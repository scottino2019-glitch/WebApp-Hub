<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Live Sandbox</title>
  <style>
    :root {
      --accent: #ea580c;
      --accent-hover: #c2410c;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: var(--accent);
      font-size: 1.1rem;
    }
    .badge {
      font-size: 0.75rem;
      background: #ffedd5;
      color: #9a3412;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid #fed7aa;
      font-weight: 700;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, button {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    select:focus, button:hover { background: #e2e8f0; color: #0f172a; }
    button.primary {
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      border: none;
    }
    button.primary:hover { background: var(--accent-hover); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      background: var(--surface);
    }
    .editor-section {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: #fafafa;
    }
    .tabs {
      display: flex;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 9px 18px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--muted);
      border-right: 1px solid var(--border);
      background: transparent;
      border-top: none;
      border-bottom: none;
      border-radius: 0;
    }
    .tab.active {
      color: var(--accent);
      background: #ffffff;
      border-bottom: 2px solid var(--accent);
    }
    textarea {
      flex: 1;
      background: #ffffff;
      color: #1e293b;
      border: none;
      padding: 20px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      outline: none;
      resize: none;
      display: none;
    }
    textarea.active { display: block; }
    .preview-section {
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>HTML Live Sandbox</span>
      <span class="badge">HTML</span>
    </div>
    <div class="controls">
      <select id="presetSelect" onchange="loadPreset(this.value)">
        <option value="card">Preset: Card Interattiva</option>
        <option value="counter">Preset: Mini Contatore JS</option>
        <option value="form">Preset: Form Login Stiloso</option>
      </select>
      <button onclick="runCode()">Esegui Codice</button>
      <button class="primary" onclick="exportHTML()">Scarica HTML</button>
    </div>
  </header>

  <main>
    <div class="editor-section">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('html')">HTML</button>
        <button class="tab" onclick="switchTab('css')">CSS</button>
        <button class="tab" onclick="switchTab('js')">JS</button>
      </div>
      <textarea id="codeHtml" class="active" spellcheck="false" placeholder="<!-- Scrivi qui il codice HTML -->"></textarea>
      <textarea id="codeCss" spellcheck="false" placeholder="/* Scrivi qui il codice CSS */"></textarea>
      <textarea id="codeJs" spellcheck="false" placeholder="// Scrivi qui il codice JavaScript"></textarea>
    </div>

    <div class="preview-section">
      <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
    </div>
  </main>

  <script>
    const presets = {
      card: {
        html: `<div class="card">
  <div class="tag">HTML & CSS</div>
  <h2>Card Interattiva</h2>
  <p>Questa è un'anteprima istantanea compilata al volo direttamente nel sandbox.</p>
  <button id="likeBtn">❤️ Mi Piace (<span id="count">0</span>)</button>
</div>`,
        css: `body {
  font-family: system-ui, sans-serif;
  display: grid;
  place-content: center;
  height: 100vh;
  margin: 0;
  background: #f8fafc;
  color: #0f172a;
}
.card {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  padding: 28px;
  border-radius: 16px;
  max-width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
}
.tag {
  color: #ea580c;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 8px;
}
h2 { margin: 0 0 10px; font-size: 22px; color: #0f172a; }
p { color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
button {
  background: #ea580c;
  border: none;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.1s;
}
button:hover { background: #c2410c; }
button:active { transform: scale(0.96); }`,
        js: `let likes = 0;
document.getElementById('likeBtn').addEventListener('click', () => {
  likes++;
  document.getElementById('count').textContent = likes;
});`
      },
      counter: {
        html: `<div class="counter-box">
  <h1>Mini Contatore</h1>
  <div class="display" id="val">0</div>
  <div class="btn-group">
    <button onclick="decrement()">- 1</button>
    <button onclick="reset()">Azzera</button>
    <button onclick="increment()">+ 1</button>
  </div>
</div>`,
        css: `body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: sans-serif;
  background: #f8fafc;
  color: #0f172a;
}
.counter-box {
  background: #ffffff;
  padding: 36px 48px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid #e2e8f0;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
h1 { font-size: 20px; margin: 0; color: #64748b; }
.display {
  font-size: 64px;
  font-weight: 800;
  color: #ea580c;
  margin: 20px 0;
  font-family: monospace;
}
.btn-group { display: flex; gap: 10px; justify-content: center; }
button {
  background: #f1f5f9;
  color: #1e293b;
  border: 1px solid #cbd5e1;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:hover { background: #ea580c; color: #fff; border-color: #ea580c; }`,
        js: `let c = 0;
function updateUI() { document.getElementById('val').textContent = c; }
function increment() { c++; updateUI(); }
function decrement() { c--; updateUI(); }
function reset() { c = 0; updateUI(); }`
      },
      form: {
        html: `<form class="login-box" onsubmit="event.preventDefault(); alert('Login effettuato con successo!');">
  <h3>Accedi al Portale</h3>
  <input type="email" placeholder="Email aziendale" required />
  <input type="password" placeholder="Password" required />
  <button type="submit">Entra</button>
</form>`,
        css: `body {
  margin: 0;
  height: 100vh;
  display: grid;
  place-content: center;
  background: #f8fafc;
  font-family: system-ui, sans-serif;
}
.login-box {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  padding: 32px;
  border-radius: 16px;
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}
h3 { margin: 0 0 6px; color: #ea580c; font-size: 20px; }
input {
  background: #fafafa;
  border: 1px solid #cbd5e1;
  color: #0f172a;
  padding: 12px;
  border-radius: 8px;
  outline: none;
}
input:focus { border-color: #ea580c; background: #fff; }
button {
  background: #ea580c;
  border: none;
  color: #fff;
  padding: 12px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
}`,
        js: `// Gestione attiva`
      }
    };

    const codeHtml = document.getElementById('codeHtml');
    const codeCss = document.getElementById('codeCss');
    const codeJs = document.getElementById('codeJs');
    const previewFrame = document.getElementById('previewFrame');

    function switchTab(lang) {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('textarea').forEach(ta => ta.classList.remove('active'));

      if (lang === 'html') {
        document.querySelectorAll('.tabs .tab')[0].classList.add('active');
        codeHtml.classList.add('active');
      } else if (lang === 'css') {
        document.querySelectorAll('.tabs .tab')[1].classList.add('active');
        codeCss.classList.add('active');
      } else {
        document.querySelectorAll('.tabs .tab')[2].classList.add('active');
        codeJs.classList.add('active');
      }
    }

    function runCode() {
      const fullDoc = `<!DOCTYPE html>
<html>
<head>
  <style>${codeCss.value}</style>
</head>
<body>
  ${codeHtml.value}
  <script>${codeJs.value}<\/script>
</body>
</html>`;
      previewFrame.srcdoc = fullDoc;
    }

    function loadPreset(key) {
      const p = presets[key];
      if (!p) return;
      codeHtml.value = p.html;
      codeCss.value = p.css;
      codeJs.value = p.js;
      runCode();
    }

    function exportHTML() {
      const fullDoc = `<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Esportazione Sandbox</title>
  <style>${codeCss.value}</style>
</head>
<body>
  ${codeHtml.value}
  <script>${codeJs.value}<\/script>
</body>
</html>`;
      const blob = new Blob([fullDoc], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'progetto-sandbox.html';
      a.click();
    }

    loadPreset('card');
    [codeHtml, codeCss, codeJs].forEach(el => el.addEventListener('input', () => {
      clearTimeout(window._sandTimer);
      window._sandTimer = setTimeout(runCode, 500);
    }));
  </script>
</body>
</html>
