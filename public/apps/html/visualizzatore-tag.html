<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzatore Albero Tag DOM</title>
  <style>
    :root {
      --accent: #f97316;
      --bg: #0c0a09;
      --surface: #1c1917;
      --border: #44403c;
      --text: #fafaf9;
      --muted: #a8a29e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      color: var(--accent);
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(249, 115, 22, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      background: #292524;
      color: #fafaf9;
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #44403c; }
    button.primary {
      background: var(--accent);
      color: #0c0a09;
      font-weight: 600;
      border: none;
    }
    button.primary:hover { background: #ea580c; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }
    .editor-col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .bar-title {
      padding: 8px 16px;
      background: rgba(28, 25, 23, 0.8);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      background: #000;
      color: #f5f5f4;
      border: none;
      padding: 16px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      resize: none;
      outline: none;
    }
    .tree-col {
      padding: 20px;
      overflow-y: auto;
      background: #09090b;
    }
    .tree-node {
      margin-left: 20px;
      position: relative;
      padding: 4px 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
    }
    .tree-node::before {
      content: '';
      position: absolute;
      left: -12px;
      top: 14px;
      width: 10px;
      height: 1px;
      background: #52525b;
    }
    .tree-node::after {
      content: '';
      position: absolute;
      left: -12px;
      top: 0;
      width: 1px;
      height: 100%;
      background: #52525b;
    }
    .tree-node:last-child::after {
      height: 14px;
    }
    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #27272a;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #3f3f46;
      color: #fdba74;
      cursor: pointer;
    }
    .tag-badge:hover {
      border-color: var(--accent);
      background: #3f3f46;
    }
    .tag-name { font-weight: 700; color: #fb923c; }
    .tag-attrs { color: #a1a1aa; font-size: 0.78rem; }
    .text-val { color: #86efac; font-style: italic; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>Visualizzatore Albero Tag DOM</span>
      <span class="badge">HTML</span>
    </div>
    <div class="btn-group">
      <button onclick="loadBoilerplate()">Carica Modello HTML5</button>
      <button class="primary" onclick="renderTree()">Aggiorna Albero</button>
    </div>
  </header>

  <main>
    <div class="editor-col">
      <div class="bar-title">Codice Sorgente HTML</div>
      <textarea id="srcInput" spellcheck="false"></textarea>
    </div>
    <div class="tree-col">
      <div class="bar-title" style="margin: -20px -20px 16px; position: sticky; top:-20px;">Gerarchia Elementi DOM</div>
      <div id="treeContainer"></div>
    </div>
  </main>

  <script>
    const sample = `<article class="post-card" id="feat-1">
  <header class="header">
    <h2 class="title">Introduzione al DOM</h2>
    <span class="meta">Pubblicato il 2026</span>
  </header>
  <section class="content">
    <p>Il Document Object Model rappresenta la pagina come un <strong>albero gerarchico</strong>.</p>
    <ul class="tag-list">
      <li class="item">Elementi padre</li>
      <li class="item">Nodi figli</li>
      <li class="item">Attributi e testo</li>
    </ul>
  </section>
  <footer class="actions">
    <button type="button" class="btn">Approfondisci</button>
  </footer>
</article>`;

    const srcInput = document.getElementById('srcInput');
    const treeContainer = document.getElementById('treeContainer');

    function loadBoilerplate() {
      srcInput.value = sample;
      renderTree();
    }

    function buildNodeView(domNode) {
      if (domNode.nodeType === Node.TEXT_NODE) {
        const txt = domNode.textContent.trim();
        if (!txt) return null;
        const el = document.createElement('div');
        el.className = 'tree-node';
        el.innerHTML = `<span class="text-val">"${txt.length > 40 ? txt.substring(0, 40) + '...' : txt}"</span>`;
        return el;
      }

      if (domNode.nodeType === Node.ELEMENT_NODE) {
        const el = document.createElement('div');
        el.className = 'tree-node';

        let attrStr = '';
        if (domNode.id) attrStr += `#${domNode.id} `;
        if (domNode.className) attrStr += `.${domNode.className.split(' ').join('.')}`;

        const badge = document.createElement('span');
        badge.className = 'tag-badge';
        badge.innerHTML = `<span class="tag-name">&lt;${domNode.tagName.toLowerCase()}&gt;</span> <span class="tag-attrs">${attrStr}</span>`;
        el.appendChild(badge);

        for (let child of domNode.childNodes) {
          const childView = buildNodeView(child);
          if (childView) el.appendChild(childView);
        }
        return el;
      }
      return null;
    }

    function renderTree() {
      treeContainer.innerHTML = '';
      const parser = new DOMParser();
      const doc = parser.parseFromString(srcInput.value, 'text/html');
      
      const bodyChildren = doc.body.childNodes;
      let count = 0;
      for (let child of bodyChildren) {
        const view = buildNodeView(child);
        if (view) {
          treeContainer.appendChild(view);
          count++;
        }
      }
      if (count === 0) {
        treeContainer.innerHTML = '<div style="color:#71717a; padding:20px;">Nessun tag rilevato o codice HTML non valido.</div>';
      }
    }

    srcInput.value = sample;
    renderTree();
    srcInput.addEventListener('input', () => {
      clearTimeout(window._treeTimer);
      window._treeTimer = setTimeout(renderTree, 350);
    });
  </script>
</body>
</html>
